name: Android CI/CD Build & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test HearU
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Bootstrap Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Fetching official Gradle 8.7 wrapper jar..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace --no-daemon > test_run.log 2>&1 || {
            echo "::error::Unit tests / compilation failed!"
            grep -A 20 "\* What went wrong:" test_run.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -B 1 -A 4 "e: " test_run.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            for f in $(find app/build/test-results -name "*.xml"); do
              echo "=== $f ==="
              cat "$f"
            done
            exit 1
          }

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearu-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
