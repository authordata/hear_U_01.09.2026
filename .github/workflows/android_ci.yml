name: Android CI/CD Build & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build & Test HearU
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Bootstrap Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Fetching official Gradle 8.7 wrapper jar..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee test_run.log || {
            echo "::error::Unit test execution failed!"
            tail -n 200 test_run.log > failure_snippet.txt
            gh issue create --repo authordata/hear_U_01.09.2026 --title "CI Build Failure Diagnostics" --body-file failure_snippet.txt || true
            exit 1
          }

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
